name: EAS CI/CD & Auto Updates (PlantDoc AI)

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Build a fresh standalone Android APK file?'
        required: true
        type: boolean
        default: false
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  ota_update:
    name: 🚀 Push Over-The-Air Auto Update
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📱 Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install Dependencies
        working-directory: ./mobile
        run: npm install --legacy-peer-deps

      - name: 🚀 Publish Instant OTA Update
        working-directory: ./mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli update --channel preview --auto --non-interactive

  build_apk:
    name: 🤖 Compile Standalone Android APK (Free GitHub Runner)
    if: github.event.inputs.build_apk == 'true' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      EXPO_UPDATE_CHANNEL: "preview"
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install Mobile Dependencies
        working-directory: ./mobile
        run: npm install --legacy-peer-deps

      - name: ⚙️ Generate Native Android Code (Expo Prebuild)
        working-directory: ./mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL || 'https://plant-doctor-ai-backend.vercel.app/api/v1' }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID || '871742373136-u15kngchhses9d5rp95dgd4ii0iff10s.apps.googleusercontent.com' }}
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID || '871742373136-tta4e360thb0o8sehijb4g5sd7si3bii.apps.googleusercontent.com' }}
        run: npx expo prebuild --platform android --no-install

      - name: 🔨 Compile Standalone Android APK with Gradle
        working-directory: ./mobile/android
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=1024m'"
        run: |
          chmod +x gradlew
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            ./gradlew assembleDebug -x lintVitalAnalyzeRelease -x lintVitalRelease --no-daemon
          else
            ./gradlew assembleRelease -x lintVitalAnalyzeRelease -x lintVitalRelease --no-daemon
          fi

      - name: 📦 Locate APK Output
        id: find_apk
        run: |
          APK_PATH=$(find mobile/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: 🚀 Upload Standalone APK Artifact (Downloadable from GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: PlantDoc-AI-Android-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      - name: 🏷️ Publish GitHub Release (if triggered by git tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
