services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plantdoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plantdoc}
      POSTGRES_DB: ${POSTGRES_DB:-plantdoc}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@plantdoc.ai
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  backend:
    build:
      context: ./backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-plantdoc}:${POSTGRES_PASSWORD:-plantdoc}@postgres:5432/${POSTGRES_DB:-plantdoc}
    depends_on:
      - postgres

volumes:
  postgres_data:
